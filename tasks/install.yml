# code: language=ansible
# vim: set filetype=yaml.ansible :
---
- name: "install unzip"
  ansible.builtin.import_tasks:
    file: unzip.yml

- name: "create pingtunnel group"
  ansible.builtin.group:
    name: "{{ pingtunnel_user }}"
    system: true

- name: "create pingtunnel user"
  ansible.builtin.user:
    name: "{{ pingtunnel_user }}"
    group: "{{ pingtunnel_user }}"
    shell: /usr/sbin/nologin
    system: true
    create_home: false

- name: "create release cache directory"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - "{{ pingtunnel_extract_path }}"

- name: "download release"
  ansible.builtin.get_url:
    url: "{{ pingtunnel_install_url }}"
    dest: "{{ pingtunnel_install_tmp_path }}"
    checksum: "{{ pingtunnel_install_checksum or omit }}"
    owner: root
    group: root
    mode: '0644'

- name: "extract release"
  ansible.builtin.unarchive:
    src: "{{ pingtunnel_install_tmp_path }}"
    dest: "{{ pingtunnel_extract_path }}"
    mode: '0755'
    include:
      - pingtunnel
    remote_src: true

# Replace the executable atomically, then restart affected instances.
- name: "install pingtunnel binary"
  ansible.builtin.copy:
    src: "{{ pingtunnel_extract_path }}/pingtunnel"
    dest: "{{ pingtunnel_binary_path }}"
    remote_src: true
    owner: root
    group: root
    mode: '0755'
  register: pingtunnel_binary_result
